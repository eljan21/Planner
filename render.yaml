# Render Blueprint — https://render.com/docs/blueprint-spec
# Free plan: no persistent disk, so the SQLite data is wiped whenever the service restarts or redeploys.
services:
  - type: web
    name: khayas-planner
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false          # asked for in the Render dashboard
      - key: ALLOWED_EMAILS
        sync: false          # e.g. dostun@gmail.com — leave empty to allow any Gmail
      - key: ALLOW_DEMO_LOGIN
        value: "true"        # preview: no-Google demo button (anyone with the link can use it) — set "false" once Google sign-in works
